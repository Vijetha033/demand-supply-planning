[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-planning"
version = "1.0.0"
description = "ORYVA AI student assignment: demand, inventory & supply planning with synthetic data"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pandas>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
supply-planning = "supply_planning.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
